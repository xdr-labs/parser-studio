name: Parser Studio quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Deterministic unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
      - name: Offline Python standard-library sender grammar
        run: python3 -m unittest discover -s tests -p 'test_python_sender_formats.py' -v
      - name: Embedded Multi-Pass standard-library structural service
        run: python3 -m unittest discover -s tests -p 'test_embedded_multipass_service.py' -v
      - name: Lossless Linux Audit, CRI and Docker framing contract
        run: python3 -m unittest discover -s tests -p 'test_audit_cri_docker_framing_20261019.py' -v
      # Source-only original GELF and JSON Text Sequence framing must reject
      # repeated decoded object keys before creating a logical source frame.
      # This intentionally does not claim a native DRAFT transport compiler.
      - name: Strict GELF and RFC7464 duplicate JSON source framing
        run: python3 -m unittest discover -s tests -p 'test_gelf_jsonseq_duplicate_identity_20261021.py' -v
      - name: Strict RFC 5424 free-form MSG and original UTF-8 byte offsets
        run: python3 -m unittest discover -s tests -p 'test_rfc5424_msg_source_20261019.py' -v
      - name: RFC 3164 and BSD message grammar with original value no-loss gate
        run: python3 -m unittest discover -s tests -p 'test_rfc3164_freeform_content_20261020.py' -v
      - name: Generic quoted labels and original implicit-TAB LEEF source preservation
        run: |
          python3 -m unittest discover -s tests -p 'test_generic_quoted_labels_20261020.py' -v
          python3 -m unittest discover -s tests -p 'test_leef_interpretation_review_20261020.py' -v
      - name: Mainline offline authoring backend build and HTTP security gate
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm run check --prefix backend
          npm run build --prefix backend
          # The runner provides Ruby; verify the native helper parses before
          # the complete offline authoring test gate.
          ruby -c backend/templates/generic-structural-helper.rb.tpl
          ruby -c backend/templates/ruby-forwarder-family.rb.tpl
          # Product scope is a finite, explicit list; keep broader historical
          # target/Drain3 regression failures visible in backend documentation.
          npm run test:authoring --prefix backend
      - name: Install isolated Chromium and dependencies
        run: npx playwright install --with-deps chromium

      # First-time users may review/override the shared CONF listener port
      # before submitting source logs; both bytes and HTTP project must agree.
      # The selected listener remains a DRAFT, never an opened or reserved port.
      - name: Default 6801 source-entry and actual parser CONF Chromium
        env:
          PARSER_STUDIO_SCOPED_AUTHORING_E2E: '1'
          PARSER_STUDIO_BROWSER_BACKEND: '1'
          PARSER_STUDIO_BACKEND_ROOT: backend
          PARSER_STUDIO_BACKEND_HEAD: ${{ github.sha }}
          PARSER_STUDIO_BACKEND_PORT: '5611'
          PARSER_STUDIO_TEST_PORT: '5610'
          PARSER_STUDIO_MULTIPASS_PORT: '5612'
          PARSER_STUDIO_TEST_MULTIPASS: '1'
        run: npx playwright test tests/parser-listener-port-6801.spec.ts --project=chromium --workers=1

      # Newly approved fixed-7.0 normalization integrity gate. The previous
      # 41-case exact-head browser suite remains untouched; these three cases
      # require the same built backend and real in-repository Multi-Pass API.
      - name: Fixed Stellar Cyber 7.0 semantic and namespace Chromium
        env:
          PARSER_STUDIO_SCOPED_AUTHORING_E2E: '1'
          PARSER_STUDIO_BROWSER_BACKEND: '1'
          PARSER_STUDIO_BACKEND_ROOT: backend
          PARSER_STUDIO_BACKEND_HEAD: ${{ github.sha }}
          PARSER_STUDIO_BACKEND_PORT: '5541'
          PARSER_STUDIO_TEST_PORT: '5540'
          PARSER_STUDIO_MULTIPASS_PORT: '5542'
          PARSER_STUDIO_TEST_MULTIPASS: '1'
        run: |
          set -euo pipefail
          npx playwright test tests/stellar7-normalization-safety-20261021.spec.ts tests/stellar7-runtime-semantic-preview-20261021.spec.ts --project=chromium --workers=1 --reporter=json > /tmp/parser-stellar7-normalization-browser.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/parser-stellar7-normalization-browser.json','utf8'));const x=r.stats;if(x.expected!==4||x.skipped!==0||x.unexpected!==0||x.flaky!==0||(r.errors||[]).length){console.error('Stellar 7.0 safety E2E did not pass 4/4',x,r.errors);process.exit(1)}console.log('STELLAR7_NORMALIZATION_CHROMIUM_PASS 4/4')"
      # Duplicate object keys must never overwrite an earlier source value.
      # Native Ruby execution is part of the offline authoring test scope.
      - name: Strict JSON duplicate-source desktop Chromium (same HEAD)
        env:
          PARSER_STUDIO_SCOPED_AUTHORING_E2E: '1'
          PARSER_STUDIO_BROWSER_BACKEND: '1'
          PARSER_STUDIO_BACKEND_ROOT: backend
          PARSER_STUDIO_BACKEND_HEAD: ${{ github.sha }}
          PARSER_STUDIO_BACKEND_PORT: '5561'
          PARSER_STUDIO_TEST_PORT: '5560'
          PARSER_STUDIO_MULTIPASS_PORT: '5562'
          PARSER_STUDIO_TEST_MULTIPASS: '1'
        run: |
          set -euo pipefail
          npx playwright test tests/json-duplicate-source-parity-20261021.spec.ts tests/generic-json-duplicate-source-20261021.spec.ts tests/generic-json-duplicate-browser-20261021.spec.ts --project=chromium --workers=1 --reporter=json > /tmp/parser-json-duplicate-source-browser.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/parser-json-duplicate-source-browser.json','utf8')); const x=r.stats; if(x.expected!==5||x.skipped!==0||x.unexpected!==0||x.flaky!==0||(r.errors||[]).length){console.error('JSON duplicate source gate failed',x,r.errors);process.exit(1)}console.log('STRICT_JSON_DUPLICATE_SOURCE_CHROMIUM_PASS 5/5')"

      # Explicit RFC5424/RFC3164 JSON and bounded multiline grouping must
      # refuse duplicate decoded object members, matching the strict native
      # DRAFT Ruby parser already qualified in the previous stacked commit.
      - name: Strict Syslog JSON and logical-boundary source Chromium
        env:
          PARSER_STUDIO_BROWSER_BACKEND: '1'
          PARSER_STUDIO_BACKEND_ROOT: backend
          PARSER_STUDIO_BACKEND_HEAD: ${{ github.sha }}
          PARSER_STUDIO_BACKEND_PORT: '5581'
          PARSER_STUDIO_TEST_PORT: '5580'
          PARSER_STUDIO_MULTIPASS_PORT: '5582'
          PARSER_STUDIO_TEST_MULTIPASS: '1'
        run: |
          set -euo pipefail
          npx playwright test tests/syslog-json-duplicate-boundary-20261021.spec.ts --project=chromium --workers=1 --reporter=json > /tmp/parser-syslog-json-boundary-chromium.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/parser-syslog-json-boundary-chromium.json','utf8'));const x=r.stats;if(x.expected!==2||x.skipped!==0||x.unexpected!==0||x.flaky!==0||(r.errors||[]).length){console.error('Syslog JSON strict-source 2/2 gate failed',x,r.errors);process.exit(1)}console.log('SYSLOG_JSON_BOUNDARY_CHROMIUM_PASS 2/2')"

      # Pre-analysis value-free source census must never call a duplicated
      # KV source name "ready" before the reviewed source engine checks it.
      # Existing independently validated Multi-Pass recovery remains allowed.
      - name: Strict KV duplicate-key beginner source accounting Chromium
        env:
          PARSER_STUDIO_BROWSER_BACKEND: '1'
          PARSER_STUDIO_BACKEND_ROOT: backend
          PARSER_STUDIO_BACKEND_HEAD: ${{ github.sha }}
          PARSER_STUDIO_BACKEND_PORT: '5591'
          PARSER_STUDIO_TEST_PORT: '5590'
          PARSER_STUDIO_MULTIPASS_PORT: '5592'
          PARSER_STUDIO_TEST_MULTIPASS: '1'
        run: |
          set -euo pipefail
          npx playwright test tests/kv-duplicate-census-safety-20261021.spec.ts --project=chromium --workers=1 --reporter=json > /tmp/parser-kv-duplicate-census-browser.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/parser-kv-duplicate-census-browser.json','utf8'));const x=r.stats;if(x.expected!==2||x.skipped!==0||x.unexpected!==0||x.flaky!==0||(r.errors||[]).length){console.error('KV duplicate-key census 2/2 gate failed',x,r.errors);process.exit(1)}console.log('KV_DUPLICATE_CENSUS_BROWSER_PASS 2/2')"

      # Fixed 7.0 field suggestions must remain explicitly reviewed per
      # event type. Offline exact-HEAD Backend + Python Multi-Pass; no mocks.
      - name: Stellar 7.0 conditional event-family mapping Chromium
        env:
          PARSER_STUDIO_SCOPED_AUTHORING_E2E: '1'
          PARSER_STUDIO_BROWSER_BACKEND: '1'
          PARSER_STUDIO_BACKEND_ROOT: backend
          PARSER_STUDIO_BACKEND_HEAD: ${{ github.sha }}
          PARSER_STUDIO_BACKEND_PORT: '5571'
          PARSER_STUDIO_TEST_PORT: '5570'
          PARSER_STUDIO_MULTIPASS_PORT: '5572'
          PARSER_STUDIO_TEST_MULTIPASS: '1'
        run: |
          set -euo pipefail
          npx playwright test tests/stellar7-reviewed-family-mapping-20261021.spec.ts tests/stellar7-event-family-reviewed-browser-20261021.spec.ts --project=chromium --workers=1 --reporter=json > /tmp/parser-stellar7-conditional-browser.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/parser-stellar7-conditional-browser.json','utf8'));const x=r.stats;if(x.expected!==2||x.skipped!==0||x.unexpected!==0||x.flaky!==0||(r.errors||[]).length){console.error('Stellar 7.0 reviewed conditional mapping must execute 2/2',x,r.errors);process.exit(1)}console.log('STELLAR7_REVIEWED_CONDITIONAL_BROWSER_PASS 2/2')"

      # Historical browser tests require an actual local parser compiler for
      # map/review/create; without it they fail on backend-unavailable states
      # unrelated to the logged security event. Reuse the exact pinned backend
      # for the ordinary browser suite and separately run the integrated E2E.
      # No DP, sensor, credential, target integration or deployment is enabled.
      # These tests require the newest conditional family/forwarder compiler
      # from this exact PR HEAD. The evergreen browser suite below uses an
      # older pinned independent backend and intentionally does not re-run
      # these two tests; this gate executes them, not merely marks them green.
      - name: Exact-head named multi-log input, event-family and relay browser acceptance
        env:
          PARSER_STUDIO_SCOPED_AUTHORING_E2E: '1'
          PARSER_STUDIO_BROWSER_BACKEND: '1'
          PARSER_STUDIO_BACKEND_ROOT: backend
          PARSER_STUDIO_BACKEND_HEAD: ${{ github.sha }}
          PARSER_STUDIO_BACKEND_PORT: '5451'
          PARSER_STUDIO_TEST_PORT: '5450'
          PARSER_STUDIO_MULTIPASS_PORT: '5452'
          PARSER_STUDIO_TEST_MULTIPASS: '1'
        run: |
          set -euo pipefail
          npx playwright test tests/reviewed-event-family-backend.spec.ts tests/explicit-multi-log-input.spec.ts tests/chatgpt-reviewed-conditional-generation-20261021.spec.ts tests/chatgpt-solution-multitype-favicon-20261021.spec.ts tests/named-type-stream-boundaries-20261019.spec.ts tests/advanced-docker-compilability-probe-20261019.spec.ts tests/advanced-mixed-original-source-20261019.spec.ts tests/two-profile-beta-user-journeys-20261020.spec.ts tests/novice-vendor-field-collision-20261020.spec.ts tests/novice-csv-lexical-accounting-20261020.spec.ts tests/novice-csv-embedded-query-20261020.spec.ts tests/browser-rejected-local-version-recovery-20261020.spec.ts tests/novice-quoted-pair-csv-20261020.spec.ts tests/python-sender-auto-csv-query-20261020.spec.ts tests/browser-full-history-restore-20261020.spec.ts tests/browser-local-versions.spec.ts tests/reviewed-csv-local-sender-integration-20261020.spec.ts --project=chromium --workers=1 --reporter=json > /tmp/parser-studio-event-family-browser.json
          node -e "const s=require('fs').readFileSync('/tmp/parser-studio-event-family-browser.json','utf8'); const x=JSON.parse(s).stats; if(x.expected!==43||x.skipped!==0||x.unexpected!==0||x.flaky!==0){console.error('Expected 43 executed, passing same-HEAD source, ChatGPT reviewed conditional, reviewed CSV, Python sender and local version E2E cases',x);process.exit(1)} console.log('EXACT_HEAD_COMBINED_SOURCE_CSV_SENDER_LOCAL_BROWSER_PASS 43/43');"

      # A standalone, scoped verification: real Chromium and the exact-HEAD
      # Python Multi-Pass + authoring backend, without external HTTP mocks.
      # The isolated .isolated.ts spec is deliberately excluded from the
      # evergreen *.spec.ts suite and its independent compiler pin.
      - name: Exact-head RFC 3164 and 5424 MSG source and draft-review Chromium
        run: |
          set -euo pipefail
          python3 runtime/multipass/multipass_preview_api.py --port 4297 >/tmp/parser-rfc5424-msg-multipass-ci.log 2>&1 &
          mp_pid=$!
          PARSER_BACKEND_PORT=4187 node backend/dist/src/server.js >/tmp/parser-rfc5424-msg-authoring-ci.log 2>&1 &
          author_pid=$!
          PARSER_STUDIO_BACKEND_PORT=4187 PARSER_STUDIO_MULTIPASS_PORT=4297 ./node_modules/.bin/vite --host 127.0.0.1 --port 5180 --strictPort >/tmp/parser-rfc5424-msg-web-ci.log 2>&1 &
          vite_pid=$!
          trap 'kill "$mp_pid" "$author_pid" "$vite_pid" 2>/dev/null || true; wait "$mp_pid" "$author_pid" "$vite_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4297/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:4187/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:5180/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npx playwright test --config playwright.rfc5424-msg-isolated-20261019.config.ts --project=chromium --workers=1 --reporter=json >/tmp/parser-rfc5424-msg-chromium-ci.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/parser-rfc5424-msg-chromium-ci.json','utf8')).stats; if(x.expected!==6||x.skipped!==0||x.unexpected!==0||x.flaky!==0){console.error('All six RFC 3164 and 5424 real browser tests must execute and pass',x);process.exit(1)} console.log('SYSLOG_STANDARD_REAL_HTTP_CHROMIUM_PASS 6/6');"

      - name: Real Chromium source-container beginner review (same HEAD)
        run: |
          npx playwright test tests/novice-audit-cri-docker-20261019.spec.ts             --config=playwright.poc-followup-containers-20261019.config.ts             --project=chromium --workers=1

      - name: Original-source and mixed-profile downloads, reviewed recovery and large-batch Chromium
        env:
          PARSER_STUDIO_SCOPED_AUTHORING_E2E: '1'
          PARSER_STUDIO_BROWSER_BACKEND: '1'
          PARSER_STUDIO_BACKEND_ROOT: backend
          PARSER_STUDIO_BACKEND_HEAD: ${{ github.sha }}
          PARSER_STUDIO_BACKEND_PORT: '5461'
          PARSER_STUDIO_TEST_PORT: '5460'
          PARSER_STUDIO_MULTIPASS_PORT: '5462'
          PARSER_STUDIO_TEST_MULTIPASS: '1'
        run: |
          set -euo pipefail
          npx playwright test --config playwright.roadmap-followup-20261020.config.ts --project=chromium --workers=1 --reporter=json > /tmp/parser-studio-roadmap-followup-browser.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/parser-studio-roadmap-followup-browser.json','utf8')); const x=r.stats; if(x.expected!==11||x.skipped!==0||x.unexpected!==0||x.flaky!==0||(r.errors||[]).length){console.error('All eleven original-source, mixed-profile, recovery, 100/400-event, cancellation and format-transition cases must execute and pass',x,r.errors);process.exit(1)} console.log('ROADMAP_FOLLOWUP_REAL_CHROMIUM_PASS 11/11');"

      # The independent-backend evergreen browser catalogue runs in the
      # complete six-shard browser-regression matrix below. No cases are dropped.
      # The deployed mainline entrypoint must never be replaced by the older
      # external pinned compiler used in compatibility-only tests above.
      - name: Same-HEAD authoring-only HTTP and beginner Chromium acceptance
        run: |
          set -euo pipefail
          PARSER_BACKEND_PORT=4395 node backend/dist/src/mainline-authoring-server.js >/tmp/parser-studio-mainline-authoring.log 2>&1 &
          scoped_pid=$!
          trap 'kill "$scoped_pid" 2>/dev/null || true; wait "$scoped_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 25); do
            if curl --fail --silent http://127.0.0.1:4395/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          PARSER_STUDIO_BACKEND_PORT=4395 \
          PARSER_STUDIO_TEST_PORT=5185 \
          PARSER_STUDIO_TEST_MULTIPASS=1 \
          PARSER_STUDIO_MULTIPASS_PORT=5392 \
          PARSER_STUDIO_SCOPED_AUTHORING_E2E=1 \
          npx playwright test tests/common-security-logs.spec.ts tests/ai-field-correction.spec.ts tests/chatgpt-full-recovery.spec.ts tests/ai-split-merge-backend.spec.ts tests/beginner-regex-recovery.spec.ts --project=chromium --workers=2
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-studio-browser-debug
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore


  # Preserve the complete evergreen Chromium catalogue and integrated real-HTTP
  # scenarios. Split across independently isolated runners so the 18-minute
  # quality job is not cancelled before browser results can be reported.
  browser-regression:
    name: Browser regression (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund
      - name: Checkout exact independent authoring backend
        uses: actions/checkout@v4
        with:
          repository: xdr-labs/parser-studio
          ref: 429b179fc674eb07f3e2250e78aea7883a71b433
          path: .integration-backend-src
          sparse-checkout: backend
      - name: Compile pinned loopback backend
        run: |
          test "$(git -C .integration-backend-src rev-parse HEAD)" = 429b179fc674eb07f3e2250e78aea7883a71b433
          npm ci --prefix .integration-backend-src/backend --no-audit --no-fund
          npm run build --prefix .integration-backend-src/backend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run pinned-backend browser catalogue shard with real HTTP and draft guards
        env:
          PARSER_STUDIO_LIVE_BACKEND: '1'
          PARSER_STUDIO_BROWSER_BACKEND: '1'
          PARSER_STUDIO_BACKEND_ROOT: .integration-backend-src/backend
          PARSER_STUDIO_BACKEND_HEAD: 429b179fc674eb07f3e2250e78aea7883a71b433
          PARSER_STUDIO_BACKEND_PORT: '4191'
          PARSER_STUDIO_TEST_PORT: '5180'
          PARSER_STUDIO_TEST_MULTIPASS: '1'
          PARSER_STUDIO_MULTIPASS_PORT: '5292'
        run: |
          set -euo pipefail
          # The two compiler-structure assertions require today's merged
          # source compiler, not the older independent compatibility backend.
          # Both run in web-quality's exact-HEAD "Default 6801" Chromium gate.
          npx playwright test --project=chromium --workers=2 --shard=${{ matrix.shard }}/6 --grep-invert 'generated Ruby/CONF files use explicitly selected' --reporter=json > /tmp/parser-studio-browser-shard.json
          node -e "const r=require('/tmp/parser-studio-browser-shard.json');const s=r.stats;if(!s.expected||s.unexpected||s.flaky||(r.errors||[]).length){console.error('Browser shard must pass all in-scope tests',s,r.errors);process.exit(1)}console.log('BROWSER_REGRESSION_SHARD_PASS',s)"
      - name: Upload shard failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parser-studio-browser-shard-${{ matrix.shard }}-debug
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
