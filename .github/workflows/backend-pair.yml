name: Parser Studio backend native checks
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-pair.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-pair.yml"
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-pinned optional offline Drain3 worker
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-cache-dir -r scripts/drain3-requirements.txt
          echo "DRAIN3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Install pinned Ruby and Node dependencies
        working-directory: backend
        run: |
          gem install bundler -v 4.0.22 --no-document
          bundle _4.0.22_ config set --local path vendor/bundle
          bundle _4.0.22_ config set --local frozen true
          bundle _4.0.22_ install --jobs 2 --retry 2
          npm ci
      - name: Strict TypeScript, API, compiler and native synthetic Fluentd suite
        working-directory: backend
        run: bash scripts/qualify.sh
      - name: Publish fixed public-synthetic native capability manifest
        uses: actions/upload-artifact@v4
        with:
          name: parser-studio-native-synthetic-capabilities
          path: backend/.tmp/synthetic-native-capabilities.json
          if-no-files-found: error
          retention-days: 7
