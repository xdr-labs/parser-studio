# Include inside nginx http {} via sites-enabled, only after a valid HTTPS
# certificate and password file exist. Other virtual hosts are not modified.
map "$request_method|$http_origin" $parser_studio_reject_post_origin {
    default 0;
    "POST|https://app.parser.xdr.ooo" 0;
    ~^POST\| 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.parser.xdr.ooo;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/parser-studio-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://app.parser.xdr.ooo$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.parser.xdr.ooo;

    ssl_certificate /etc/letsencrypt/live/app.parser.xdr.ooo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.parser.xdr.ooo/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Parser Studio private development access";
    auth_basic_user_file /etc/nginx/parser-studio-private.htpasswd;
    client_max_body_size 3m;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/parser-studio-app;
    index index.html;

    # Only verified offline authoring and bounded source preview endpoints
    # are available. No target, sensor, Test Lab or tenant routes are exposed.
    location ^~ /api/v1/parser-pairs/ {
        if ($parser_studio_reject_post_origin) { return 403; }
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:6571;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location = /api/v1/multipass/preview {
        if ($request_method !~ ^POST$) { return 405; }
        if ($parser_studio_reject_post_origin) { return 403; }
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4304;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /api/v1/multipass/preview-batch {
        if ($request_method !~ ^POST$) { return 405; }
        if ($parser_studio_reject_post_origin) { return 403; }
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4304;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
